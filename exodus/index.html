    out += `<g class="planet ${clickable ? 'clickable' : ''} ${nearby ? 'adjacent' : ''} ${selected ? 'selected' : ''}" data-id="${n.id}">`;
    if (selected) out += `<circle class="selring" cx="${n.x}" cy="${n.y}" r="${r + 11}"/>`;
    if (n.kind === 'earth') out += `<circle cx="${n.x}" cy="${n.y}" r="62" fill="url(#glowEarth)"/>`;
    if (n.kind === 'haven') out += `<circle cx="${n.x}" cy="${n.y}" r="66" fill="url(#glowHaven)"/>`;
    out += `<circle class="pbody" cx="${n.x}" cy="${n.y}" r="${r}" fill="${fill}" stroke="${stroke}"/>`;

    if (holder)
      out += `<circle class="pring" cx="${n.x}" cy="${n.y}" r="${r + 5}" stroke="${holder.color}" stroke-width="2" stroke-dasharray="3 4"/>`;

    const hostile = n.kind === 'planet' && !holder;
    out += `<text class="pglyph" x="${n.x}" y="${n.y}" fill="${hostile ? '#c9d9ff' : stroke}">${hostile ? n.alien.glyph : n.glyph}</text>`;
    out += `<text class="pname" x="${n.x}" y="${n.y + r + 16}">${esc(n.name)}</text>`;

    if (n.kind === 'planet') {
      const sub = holder ? `held · ${holder.name}` : n.alien.name;
      out += `<text class="palien" x="${n.x}" y="${n.y + r + 29}" fill="${holder ? holder.color : ''}">${esc(sub)}</text>`;
      if (!holder) {
        for (let t = 0; t < n.alien.tier; t++)
          out += `<circle class="tierdot" cx="${n.x - (n.alien.tier - 1) * 5 + t * 10}" cy="${n.y - r - 9}" r="3" fill="${['#4ade80','#ffc247','#ff5c5c'][n.alien.tier - 1]}"/>`;
      }
    }
    if (n.kind === 'haven') {
      const need = Math.max(0, gateFor(p) - p.conquered.length);
      out += `<text class="gatelabel" x="${n.x}" y="${n.y + r + 30}">${need > 0 ? `GATE SEALED · ${need} MORE` : 'GATE OPEN'}</text>`;
    }
    if (costLabels && costLabels[n.id]) {
      const cl = costLabels[n.id];
      out += `<g class="lanecost ${cl.blocked ? 'unaffordable' : ''}">
        <rect x="${n.x - 20}" y="${n.y - r - 30}" width="40" height="19" rx="4"/>
        <text x="${n.x}" y="${n.y - r - 20}">⛽${cl.cost}</text></g>`;
    }
    if (p.beacons.includes(n.id))
      out += `<text x="${n.x + r - 2}" y="${n.y - r + 4}" font-size="13">🔆</text>`;
    G.players.forEach(pl => pl.missions.forEach(ms => {
      if (ms.targetId === n.id) out += `<text x="${n.x - r - 6}" y="${n.y - r + 6}" font-size="12">🚨</text>`;
    }));
    out += `</g>`;
  });

  // ship tokens
  const byNode = {};
  G.players.forEach(pl => { (byNode[pl.pos] = byNode[pl.pos] || []).push(pl); });
  Object.entries(byNode).forEach(([nid, list]) => {
    const n = G.board.nodes[nid];
    const r = planetRadius(n) + 15;
    list.forEach((pl, i) => {
      const ang = (-Math.PI / 2) + (i - (list.length - 1) / 2) * 0.85;
      const x = n.x + Math.cos(ang) * r, y = n.y + Math.sin(ang) * r;
      const isCur = pl.idx === G.current;
      out += `<g class="token">
        <circle cx="${x}" cy="${y}" r="${isCur ? 11 : 9}" fill="${pl.color}" opacity="${isCur ? 1 : 0.75}"/>
        <circle class="tokenring" cx="${x}" cy="${y}" r="${isCur ? 15 : 12}" stroke="${pl.color}" opacity="${isCur ? 0.9 : 0.35}"/>
        <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#04070f" font-weight="700">${pl.idx + 1}</text>
      </g>`;
    });
  });

  svg.innerHTML = out;
  applyView();
  svg.querySelectorAll('.planet').forEach(el => {
    el.onclick = () => onPlanetClick(+el.dataset.id);
  });
}

/* Clicking a world only ever selects and describes it — the confirm button
   in the action bar is the single way to spend the turn. A second click on
   the same world deselects it; it must never commit by itself, or a stray
   double-tap warps the ship somewhere it was only inspecting. */
function onPlanetClick(id) {
  if (UI.dragMoved) { UI.dragMoved = false; return; }   // that was a pan; consume once
  if (gameOver()) return;

  // While a CPU is playing you may still look around, but not act for it.
  if (isCpu(G.players[G.current])) { UI.selected = id; renderAll(); return; }

  UI.selected = (UI.selected === id) ? null : id;
  renderAll();
}

function afterWarp(result) {
  if (result === 'blocked') { renderAll(); return; }
  if (result === 'win') { renderAll(); showWin(); return; }
  if (result === 'contact') UI.pendingContact = G.players[G.current].pos;
  renderAll();
}

/* ============================================================
   SIDE PANELS
   ============================================================ */
function heartString(cur, max) {
  return '♥'.repeat(Math.max(0, cur)) + '♡'.repeat(Math.max(0, max - Math.max(0, cur)));
}

function renderFleet() {
  const pane = $('#pane-fleet');
  pane.innerHTML = G.players.map(p => {
    const eff = effectsOf(p);
    const isCur = p.idx === G.current && !gameOver();
    const weps = weaponsOf(p);
    return `
      <div class="pcard ${isCur ? 'active' : ''}" style="color:${p.color}">
        <h3>
          <span style="width:10px;height:10px;border-radius:50%;background:${p.color};display:inline-block"></span>
          <span style="color:var(--ink)">${esc(p.name)}</span>
          ${isCpu(p) ? `<span class="cputag">${esc(aiLevel(p).label)} CPU</span>` : ''}
          ${isCur ? '<span class="pill" style="margin-left:auto;font-size:10px;color:var(--cyan);border-color:var(--cyan)">ACTIVE</span>' : ''}
        </h3>
        <div class="stats" style="color:var(--ink)">
          <span class="hearts" style="color:var(--magenta)">${heartString(p.hearts, eff.maxHearts)}</span>
          <span style="color:var(--amber)">⛽ ${p.fuel}</span>
          <span style="color:var(--cyan)">◈ ${p.conquered.length}/${gateFor(p)}</span>
        </div>
        <div style="font-size:11px;color:var(--ink-faint)">
          At ${esc(G.board.nodes[p.pos].name)} · income +${eff.fuelIncome + Math.min(p.conquered.length, DEPOT_CAP)}/turn · tank ${p.fuel}/${TANK_CAP}
          ${p.deaths ? ` · ${p.deaths} loss${p.deaths > 1 ? 'es' : ''}` : ''}
        </div>
        <div class="chiprow">
          ${p.abilities.map(id => { const a = START_ABILITIES.find(x => x.id === id);
            return `<span class="chip ${a.weapon ? 'weapon' : ''}" title="${esc(a.desc)}">${a.glyph} ${esc(a.name)}</span>`; }).join('')}
          ${p.alienAbilities.map(r => `<span class="chip alien" title="${esc(r.desc)}">${esc(r.name)}</span>`).join('')}
          ${p.permEffects.length ? `<span class="chip event" title="Permanent upgrades from event cards">✦ ${p.permEffects.length} refit${p.permEffects.length > 1 ? 's' : ''}</span>` : ''}
          ${p.missions.map(m => `<span class="chip mission" title="${esc(m.card.desc)}">🚨 ${esc(G.board.nodes[m.targetId].name)}</span>`).join('')}
          ${p.wormholes.map(r => `<span class="chip event">🌀 wormhole (${r})</span>`).join('')}
          ${p.extraTurns ? `<span class="chip event">✨ ${p.extraTurns} banked turn${p.extraTurns > 1 ? 's' : ''}</span>` : ''}
        </div>
        ${isCur ? `<div style="margin-top:8px;font-size:10.5px;color:var(--ink-faint);letter-spacing:0.04em">
          Weapons: ${weps.map(w => `${esc(w.name)} <span style="color:${DMG_TYPES[w.type].color}">${DMG_TYPES[w.type].glyph}</span>`).join(' · ')}
        </div>` : ''}
      </div>`;
  }).join('');
}

function renderLog() {
  $('#pane-log').innerHTML = G.log.map(l =>
    `<div class="logline ${l.kind}">${l.playerIdx !== undefined && l.playerIdx !== null ? '' : ''}${esc(l.text)}</div>`).join('');
}

function renderCodex() {
  const known = {};
  G.board.nodes.forEach(n => { if (n.kind === 'planet') known[n.alien.id] = n; });
  $('#pane-codex').innerHTML = `
    <div class="secthead">Species in play (17 of 25)</div>
    ${ALIEN_DECK.filter(a => known[a.id]).map(a => {
      const n = known[a.id];
      return `<div class="codexcard ${n.conqueredBy !== null ? 'taken' : ''}">
        <h4>${a.glyph} ${esc(a.name)} <span style="float:right;font-family:var(--mono);font-size:11px;color:var(--magenta)">${a.hp} HULL</span></h4>
        <div class="ep">${esc(a.epithet)} · ${esc(n.name)}${n.conqueredBy !== null ? ` · taken by ${esc(G.players[n.conqueredBy].name)}` : ''}</div>
        <p style="color:${DMG_TYPES[a.resist].color}">Resists ${DMG_TYPES[a.resist].name} (−2)&nbsp;&nbsp;·&nbsp;&nbsp;<span style="color:${DMG_TYPES[a.vuln].color}">Weak to ${DMG_TYPES[a.vuln].name} (+2)</span></p>
        <p class="sw"><b>STR</b> ${esc(STRENGTHS[a.strength])}</p>
        <p class="sw w"><b>WEAK</b> ${esc(WEAKNESSES[a.weakness])}</p>
        <p style="color:var(--violet)">Bounty: <b style="color:var(--ink)">${esc(a.reward.name)}</b> — ${esc(a.reward.desc)}</p>
      </div>`;
    }).join('')}
    <div class="secthead">Held back this game (8 of 25)</div>
    ${ALIEN_DECK.filter(a => !known[a.id]).map(a =>
      `<div class="codexcard taken"><h4>${a.glyph} ${esc(a.name)}</h4><div class="ep">${esc(a.epithet)}</div></div>`).join('')}`;
}

/* ============================================================
   ACTION BAR
   ============================================================ */
function renderActions() {
  const bar = $('#actions'), hint = $('#hint');
  if (gameOver()) {
    bar.innerHTML = `<button class="primary" onclick="showWin()">Victory</button>`;
    hint.textContent = `${G.players[G.winner].name} has reached Haven.`;
    return;
  }
  const p = G.players[G.current];
  const node = G.board.nodes[p.pos];
  const eff = effectsOf(p);
  const btns = [];

  /* A CPU is at the controls: no human actions, just transport controls. */
  if (isCpu(p)) {
    hint.innerHTML = `<span style="color:${p.color}">◆ ${esc(p.name)}</span>
      <span style="color:var(--ink-faint)">(${esc(aiLevel(p).label)} CPU)</span> —
      ${AI.paused ? '<b style="color:var(--amber)">paused</b>' : esc(AI.note || 'thinking…')}`;
    bar.innerHTML =
      `<button id="a-pause" class="${AI.paused ? 'primary' : 'ghost'}">${AI.paused ? '▶ Resume' : '⏸ Pause'}</button>
       <button id="a-cpuspeed" class="ghost">⏩ ${aiSpeed().label}</button>`;
    $('#a-pause').onclick = () => {
      AI.paused = !AI.paused;
      if (AI.paused) aiCancel();
      renderAll();
    };
    $('#a-cpuspeed').onclick = () => {
      AI.speedIdx = (AI.speedIdx + 1) % AI_SPEEDS.length;
      aiCancel();          // drop the pending step so the new pace applies now
      renderAll();
    };
    return;
  }

  if (UI.mode) {
    hint.innerHTML = UI.mode.type === 'wormhole'
      ? `<b style="color:var(--violet)">Wormhole open</b> — pick any world within ${UI.mode.range} warp route${UI.mode.range > 1 ? 's' : ''}.`
      : UI.mode.type === 'routes'
      ? `<b style="color:var(--cyan)">Route costs</b> — total fuel to reach each world from here. Pick one to travel.`
      : `<b style="color:var(--amber)">Beacon recall</b> — pick one of your beacons.`;
    bar.innerHTML = (UI.selected !== null ? selectionButtonsHtml(p) : '') +
      `<button class="ghost" id="a-cancel">Cancel</button>`;
    wireSelectionButtons(p);
    $('#a-cancel').onclick = () => { UI.mode = null; UI.selected = null; renderAll(); };
    return;
  }

  const onHostile = node.kind === 'planet' && node.conqueredBy === null;

  if (onHostile && (!G.actionTaken || UI.pendingContact === p.pos) && UI.selected !== p.pos)
    btns.push(['a-engage', 'primary', `⚔ Engage ${node.alien.name}`, () => { UI.selected = null; startBattle(); renderAll(); openBattle(); }]);

  if (!G.actionTaken) {
    btns.push(['a-routes', '', '⇢ Route Costs', () => { UI.mode = { type: 'routes' }; renderAll(); }]);
    btns.push(['a-scav', '', `⛽ Scavenge (+${eff.scavenge}~)`, () => { doScavenge(); renderAll(); }]);
    if (p.fuel >= REPAIR_COST && p.hearts < eff.maxHearts)
      btns.push(['a-rep', '', `🔧 Repair (−${REPAIR_COST} fuel, → ${repairResult(p)}♥)`, () => { doRepair(); renderAll(); }]);
    if (p.wormholes.length)
      btns.push(['a-worm', '', `🌀 Use Wormhole (${p.wormholes[0]})`, () => { UI.mode = { type: 'wormhole', range: p.wormholes[0] }; renderAll(); }]);
    if (p.beacons.length && p.beacons.some(b => b !== p.pos))
      btns.push(['a-bea', '', '🔆 Beacon Recall', () => { UI.mode = { type: 'beacon' }; renderAll(); }]);
  }

  if (p.extraTurns > 0)
    btns.push(['a-extra', '', `✨ Bank turn (${p.extraTurns})`, () => {
      p.pendingUseExtra = true; endTurn(); UI.pendingContact = null; renderAll();
    }]);

  btns.push(['a-end', G.actionTaken ? 'primary' : 'ghost', 'End Turn ▸', () => {
    endTurn(); UI.pendingContact = null; UI.mode = null; UI.selected = null; renderAll();
  }]);

  bar.innerHTML = (UI.selected !== null ? selectionButtonsHtml(p) : '') +
    btns.map(b => `<button id="${b[0]}" class="${b[1]}"${b[4] ? ' disabled' : ''}>${b[2]}</button>`).join(' ');
  btns.forEach(b => { const el = $('#' + b[0]); if (el && !b[4]) el.onclick = b[3]; });
  wireSelectionButtons(p);

  if (UI.selected !== null) hint.innerHTML = selectionHintHtml(p);
  else if (onHostile)
    hint.innerHTML = `<b style="color:var(--magenta)">${esc(node.alien.name)}</b> holds ${esc(node.name)} — engage, or move on.`;
  else if (G.actionTaken)
    hint.textContent = 'Action spent. End your turn.';
  else if (legalMoves(p).every(m => m.blocked))
    hint.innerHTML = `<b style="color:var(--red)">No route affordable.</b> Scavenge for fuel.`;
  else
    hint.textContent = 'Click a world to inspect it, then Confirm in this bar to go.';

  /* Nothing left but End Turn: give the log a beat to be read, then end the
     turn unprompted. Any real choice — an engage offer, a banked turn, a
     battle still open, cards on the table — suppresses this. */
  if (G.actionTaken && btns.length === 1 && btns[0][0] === 'a-end') {
    const key = G.round + ':' + G.current;
    if (UI.autoEndKey !== key) {
      UI.autoEndKey = key;
      clearTimeout(UI.autoEndTimer);
      UI.autoEndTimer = setTimeout(() => tryAutoEnd(key), 1400);
    }
    if (UI.selected === null) hint.textContent = 'Nothing left to do — ending turn…';
  }
}

/* The delayed half of the auto-end above. Everything is revalidated here:
   the schedule-time snapshot may be stale by the time the timer fires. */
function tryAutoEnd(key) {
  if (UI.autoEndKey !== key || !G.started || gameOver()) return;
  const p = cur();
  if (isCpu(p) || !G.actionTaken || p.extraTurns > 0) return;
  if (p.battle && !p.battle.over) return;
  if (UI.pendingContact === p.pos) return;
  const overlaysClear = ['ov-card', 'ov-recap', 'ov-battle', 'ov-info', 'ov-turn']
    .every(id => $('#' + id).classList.contains('hidden'));
  if (!overlaysClear) {          // reading something — check back shortly
    UI.autoEndTimer = setTimeout(() => tryAutoEnd(key), 1000);
    return;
  }
  endTurn();
  UI.pendingContact = null; UI.mode = null; UI.selected = null;
  renderAll();
}

/* ---------- selection panel ---------- */
function selectionHintHtml(p) {
  const n = G.board.nodes[UI.selected];
  const offer = offerFor(p, UI.selected);
  const holder = isHeld(n) ? G.players[n.conqueredBy] : null;
  let what;
  if (n.kind === 'earth') what = `<span style="color:#3ba7ff">Earth — where you launched from.</span>`;
  else if (n.kind === 'haven') what = `<span style="color:var(--amber)">Haven — ${canEnterHaven(p) ? 'the Gate is open to you.' : `the Gate wants ${gateFor(p) - p.conquered.length} more seal(s).`}</span>`;
  else if (holder) what = `<span style="color:${holder.color}">Held by ${esc(holder.name)}</span> — settled, nothing left to conquer.`;
  else what = `<span style="color:var(--magenta)">${esc(n.alien.name)}</span> · ${n.alien.hp} hull · weak to
    <span style="color:${DMG_TYPES[n.alien.vuln].color}">${DMG_TYPES[n.alien.vuln].name}</span>,
    resists <span style="color:${DMG_TYPES[n.alien.resist].color}">${DMG_TYPES[n.alien.resist].name}</span>`;

  const status = offer.blocked
    ? `<span style="color:var(--red)"> · ${esc(offer.blocked)}</span>`
    : offer.kind === 'none' ? `<span style="color:var(--ink-faint)"> · ${esc(offer.note || 'nothing to do here')}</span>` : '';
  return `<b style="letter-spacing:0.12em">${esc(n.name)}</b> — ${what}${status}`;
}

function selectionButtonsHtml(p) {
  const n = G.board.nodes[UI.selected];
  const offer = offerFor(p, UI.selected);
  let html = '';
  if (offer.kind !== 'none' && !offer.blocked)
    html += `<button class="primary" id="s-go">${esc(offer.label)}</button> `;
  if (n.kind === 'planet' && !isHeld(n))
    html += `<button id="s-card">📖 Species Card</button> `;
  html += `<button class="ghost" id="s-clear">✕ Clear</button> `;
  return html;
}

function wireSelectionButtons(p) {
  if (UI.selected === null) return;
  const id = UI.selected;
  const go = $('#s-go');
  if (go) go.onclick = () => commitOffer(id, offerFor(p, id));
  const card = $('#s-card');
  if (card) card.onclick = () => showAlienCard(G.board.nodes[id]);
  const clear = $('#s-clear');
  if (clear) clear.onclick = () => { UI.selected = null; renderAll(); };
}

function renderTurnBanner() {
  const el = $('#turnbanner');
  if (!G.started) { el.innerHTML = ''; return; }
  if (gameOver()) {
    el.innerHTML = `<span class="pill" style="color:var(--cyan);border-color:var(--cyan)">HAVEN REACHED — ${esc(G.players[G.winner].name)} WINS</span>`;
    return;
  }
  const p = G.players[G.current];
  const eff = effectsOf(p);
  el.innerHTML = `
    <span class="pill" style="color:${p.color};border-color:${p.color}">◆ ${esc(p.name)}${isCpu(p) ? ' · CPU' : ''}</span>
    <span style="color:var(--ink-faint)">Round ${G.round}</span>
    <span style="color:var(--magenta)">${heartString(p.hearts, eff.maxHearts)}</span>
    <span style="color:var(--amber)">⛽ ${p.fuel}</span>
    <span style="color:var(--cyan)">◈ ${p.conquered.length}/${gateFor(p)} seals</span>`;
}

/* An engagement lives on the player, so the modal follows whose turn it is. */
function syncBattleModal() {
  const p = G.players[G.current];
  const modal = $('#ov-battle');
  if (!modal) return;
  if (p && p.battle) {
    if (modal.classList.contains('hidden')) { UI.selectedWeapon = null; modal.classList.remove('hidden'); }
    renderBattle();
  } else {
    modal.classList.add('hidden');
  }
}

function renderAll() {
  renderTurnBanner();
  renderBoard();
  renderFleet();
  renderLog();
  renderCodex();
  renderActions();
  syncBattleModal();
  maybeShowTurnIntro();
  aiTick();     // hands the turn to the CPU if it is one
}

/* Hot-seat handoff — a human's turn opens with an unmissable banner naming
   whoever has the helm. Solo games (one seat, no rivals) skip it. */
function maybeShowTurnIntro() {
  if (!G.started || gameOver() || G.players.length < 2) return;
  const p = cur();
  if (isCpu(p)) return;
  const key = G.round + ':' + G.current;
  if (UI.turnIntroKey === key) return;
  UI.turnIntroKey = key;
  $('#turn-round').textContent = `ROUND ${G.round}`;
  $('#turn-glyph').style.color = p.color;
  $('#turn-glyph').textContent = '◆';
  $('#turn-name').textContent = p.name;
  $('#turn-name').style.color = p.color;
  $('#ov-turn').classList.remove('hidden');
}

/* ============================================================
   DICE
   ============================================================ */
const PIP_LAYOUT = {
  1: [[50,50]],
  2: [[28,28],[72,72]],
  3: [[28,28],[50,50],[72,72]],
  4: [[28,28],[72,28],[28,72],[72,72]],
  5: [[28,28],[72,28],[50,50],[28,72],[72,72]],
  6: [[28,26],[72,26],[28,50],[72,50],[28,74],[72,74]]
};

/* A real die face rather than an emoji — legible at any size and themed. */
function dieSvg(n, size, cls) {
  const pips = (PIP_LAYOUT[n] || PIP_LAYOUT[1])
    .map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9"/>`).join('');
  return `<svg class="die ${cls || ''}" viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="die showing ${n}">
    <rect class="dieface" x="3" y="3" width="94" height="94" rx="18"/>
    <g class="pips">${pips}</g>
  </svg>`;
}

/* ============================================================
   BATTLE MODAL
   ============================================================ */
function openBattle() {
  UI.selectedWeapon = null;
  $('#ov-battle').classList.remove('hidden');
  renderBattle();
}

function chartTable(hlKey) {
  return `<table class="chart">
    <tr><th>2d6 + mods</th><th>Result</th><th>Effect</th></tr>
    ${BATTLE_CHART.map(r => {
      const range = r.min === -99 ? '≤ 2' : r.max === 99 ? '13 +' : (r.min === r.max ? r.min : `${r.min}–${r.max}`);
      const fx = [r.foe ? `deal ${r.foe}` : '', r.self ? `take ${r.self}` : ''].filter(Boolean).join(', ') || '—';
      return `<tr class="${hlKey === r.key ? 'hl' : ''}"><td class="r">${range}</td><td>${r.label}</td><td style="color:var(--ink-dim)">${fx}</td></tr>`;
    }).join('')}
  </table>`;
}

/* The headline card for the exchange that just happened — or, before you fire,
   what this exchange is shaping up to be. */
function exchangeCardHtml(b, p, mods, mt) {
  const lr = b.lastRoll;
  const ex = b.lastExchange;
  const a = b.alien;

  const diceRow = (d1, d2, breakdown, total, res) => `
    <div class="exdice">
      ${dieSvg(d1, 62)}${dieSvg(d2, 62)}
      <div class="exsum">
        <div class="exmath">${breakdown}</div>
        <div class="extotal">${total}</div>
      </div>
    </div>
    <div class="exresult ${res.tone}">${res.label}</div>`;

  const breakdownOf = r => `${r.d1} + ${r.d2}` +
    r.mods.map(m => ` <span class="${m.v >= 0 ? 'up' : 'down'}">${m.v >= 0 ? '+' : '−'}${Math.abs(m.v)}</span><small>${esc(m.label)}</small>`).join('');

  if (lr) {
    return `<div class="excard pending">
      ${diceRow(lr.d1, lr.d2, breakdownOf(lr), lr.total, lr.res)}
      <div class="exnote">Your reroll is still in hand — take this shot, or roll it again.</div>
    </div>`;
  }

  if (b.over) {
    const won = b.result === 'won';
    return `<div class="excard ${won ? 'best' : 'worst'}">
      <div class="exresult ${won ? 'best' : 'worst'}">${won ? 'TARGET DESTROYED' : 'HULL BREACH'}</div>
      <div class="exnote">${won
        ? `${esc(a.name)} is finished after ${b.tally.exchanges} exchange${b.tally.exchanges === 1 ? '' : 's'}.`
        : `${esc(p.name)} is lost above ${esc(G.board.nodes[b.nodeId].name)}.`}</div>
    </div>`;
  }

  if (ex) {
    const dealt = ex.dealt, taken = ex.taken;
    return `<div class="excard ${ex.res.tone}">
      ${diceRow(ex.d1, ex.d2, breakdownOf(ex), ex.total, ex.res)}
      <div class="exdamage">
        <div class="exside ${dealt ? 'hit' : 'nil'}">
          <span class="exlabel">You dealt</span><span class="exbig">${dealt}</span>
          <span class="exsub">${esc(a.name)} · ${ex.hpAfter}/${ex.maxHp} hull</span>
        </div>
        <div class="exside ${taken ? 'hurt' : 'nil'}">
          <span class="exlabel">You took</span><span class="exbig">${taken}</span>
          <span class="exsub">${heartString(ex.heartsAfter, ex.maxHearts)}</span>
        </div>
      </div>
      ${b.canPress ? `<div class="exnote press">Target reeling — fire again before it recovers, or hold.</div>` : ''}
    </div>`;
  }

  return `<div class="excard quiet">
    <div class="exprompt">Select a weapon and fire</div>
    <div class="exodds">2d6 ${mt >= 0 ? '+' : '−'} ${Math.abs(mt)}</div>
    <div class="exnote">${mods.length ? mods.map(m => `${esc(m.label)} ${m.v >= 0 ? '+' : ''}${m.v}`).join(' · ') : 'no modifiers this exchange'}</div>
  </div>`;
}

function renderBattle() {
  const b = G.battle;
  const p = G.players[G.current];
  if (!b) { $('#ov-battle').classList.add('hidden'); return; }
  const a = b.alien, eff = effectsOf(p);
  const weps = weaponsOf(p);
  if (!UI.selectedWeapon) UI.selectedWeapon = weps[weps.length - 1].id;
  const wep = weps.find(w => w.id === UI.selectedWeapon) || weps[0];

  $('#battle-title').textContent = `${G.board.nodes[b.nodeId].name} — Contact`;
  $('#battle-round').textContent = b.over ? (b.result === 'won' ? 'VICTORY' : 'SHIP LOST')
    : `Round ${b.round}${b.shots > 1 ? `.${b.shots}` : ''}`;

  const mods = b.over ? [] : battleMods(wep);
  const mt = modTotal(mods);
  const lr = b.lastRoll;
  const tide = b.tide;

  /* A shot resolves on the same click that fires it, unless it drew no blood
     and the player is holding a reroll — the only moment there is a real choice.
     Nobody ever wants to reroll a Critical Overload. */
  const shoot = (weapon) => {
    fireWeapon(weapon);
    const bb = G.battle;
    if (bb && !(bb.rerollsLeft > 0 && bb.lastRoll.res.foe === 0)) resolveRound();
    renderBattle();
    renderAll();
  };
  const tideActive = tide && Object.keys(tide.fx).length > 0;

  $('#battle-body').innerHTML = `
    <div class="battlegrid">
      <div>
        ${b.over ? '' : `<div class="tidebar ${tideActive ? tide.tone : 'quiet'}">
          <span class="tideglyph">${tideActive ? tide.glyph : '○'}</span>
          <span class="tidename">${esc(tide ? tide.name : 'Dead Calm')}</span>
          <span class="tidedesc">${esc(tide ? tide.desc : '')}</span>
          ${tideActive ? `<span class="tidefx">${tideFxText(tide.fx)}</span>` : ''}
        </div>`}
        ${b.pressure && !b.over ? `<div class="pressurebar">◎ PRESSURE +${b.pressure}
          <span>every shot that misses walks your fire closer — it clears the moment you draw blood</span></div>` : ''}
        ${exchangeCardHtml(b, p, mods, mt)}
        ${b.over ? '' : `<div class="weaponpick">
          ${weps.map(w => {
            const vuln = a.vuln === w.type, res = a.resist === w.type && !eff.ignoreResist;
            return `<button class="${w.id === wep.id ? 'sel' : ''}" data-w="${w.id}">
              <span style="color:${DMG_TYPES[w.type].color}">${DMG_TYPES[w.type].glyph}</span> ${esc(w.name)}
              ${vuln ? ' <span style="color:var(--green)">+2</span>' : ''}${res ? ' <span style="color:var(--red)">−2</span>' : ''}
            </button>`;
          }).join('')}
        </div>`}
        <div class="battlelog">${b.lines.map(l => `<div class="bl ${l.kind}">${esc(l.text)}</div>`).join('')}</div>
      </div>

      <div>
        <div class="alienportrait">
          <div class="big">${a.glyph}</div>
          <h3>${esc(a.name)}</h3>
          <div class="ep">${esc(a.epithet)}</div>
          <div class="hpbar"><div class="hpfill" style="width:${Math.max(0, b.hp) / b.maxHp * 100}%"></div></div>
          <div style="font-family:var(--mono);font-size:12px;margin-top:5px;color:var(--magenta)">${Math.max(0, b.hp)} / ${b.maxHp} HULL</div>
          <div style="margin-top:12px;text-align:left">
            <p class="sw" style="margin:4px 0"><b>STR</b> ${esc(STRENGTHS[a.strength])}</p>
            <p class="sw w" style="margin:4px 0"><b>WEAK</b> ${esc(WEAKNESSES[a.weakness])}</p>
            <p class="sw" style="margin:8px 0 0;color:var(--ink-faint)">
              Resists <span style="color:${DMG_TYPES[a.resist].color}">${DMG_TYPES[a.resist].name}</span> ·
              Weak to <span style="color:${DMG_TYPES[a.vuln].color}">${DMG_TYPES[a.vuln].name}</span>
            </p>
          </div>
        </div>
        <div style="text-align:center;margin:12px 0 6px">
          <div style="font-size:10px;letter-spacing:0.2em;color:var(--ink-faint)">${esc(p.name)}</div>
          <div class="heartsbar" style="color:var(--magenta)">${heartString(p.hearts, eff.maxHearts)}</div>
          <div style="font-family:var(--mono);font-size:11px;color:var(--amber)">⛽ ${p.fuel} fuel</div>
        </div>
        ${chartTable(lr ? lr.res.key : null)}
      </div>
    </div>`;

  $$('#battle-body [data-w]').forEach(el => el.onclick = () => { UI.selectedWeapon = el.dataset.w; renderBattle(); });

  /* footer */
  const foot = $('#battle-foot');

  /* The CPU fights its own battles — show what it is doing, offer no controls
     beyond the review gate that lets a human read the result before it moves on. */
  if (isCpu(p)) {
    const review = AI.awaitingReview;
    foot.innerHTML = `<span class="spacer" style="color:${p.color}">◆ ${esc(p.name)}
      <span style="color:var(--ink-faint)">(${esc(aiLevel(p).label)} CPU)</span>
      ${b.over ? (b.result === 'won' ? '— target destroyed' : '— ship lost')
               : review ? '— exchange complete' : '— fighting…'}</span>
      ${review ? '' : `<button id="bf-pause" class="${AI.paused ? 'primary' : 'ghost'}">${AI.paused ? '▶ Resume' : '⏸ Pause'}</button>`}
      ${review ? `<button class="primary" id="bf-continue">Continue ▸</button>` : ''}`;
    if ($('#bf-pause')) $('#bf-pause').onclick = () => { AI.paused = !AI.paused; if (AI.paused) aiCancel(); renderBattle(); renderAll(); };
    if ($('#bf-continue')) $('#bf-continue').onclick = () => {
      AI.awaitingReview = false; AI.reviewCleared = true; aiCancel(); renderAll();
    };
    armFooterOnce(foot);
    return;
  }

  if (b.over) {
    if (b.result === 'won') {
      foot.innerHTML = `<span class="spacer">${esc(G.board.nodes[b.nodeId].name)} is yours. Claim the wreck.</span>
        <button class="primary" id="b-claim">Claim Conquest</button>`;
      $('#b-claim').onclick = () => {
        const recap = claimConquest();
        $('#ov-battle').classList.add('hidden');
        renderAll();
        queueConquestCards(recap);   // humans skip the recap sheet
      };
    } else {
      foot.innerHTML = `<span class="spacer">Escape pods away.</span><button class="danger" id="b-eject">Eject</button>`;
      $('#b-eject').onclick = () => {
        handleDestroyed();
        $('#ov-battle').classList.add('hidden');
        UI.pendingContact = null;
        renderAll();
      };
    }
    armFooterOnce(foot);
    return;
  }

  const parts = [];
  parts.push(`<span class="spacer">${b.rerollsLeft ? `Rerolls left: ${b.rerollsLeft}` : ''}</span>`);
  if (lr) {
    // Only reached when the shot drew no blood and a reroll is in hand —
    // the one case where the player actually has something to decide.
    parts.push(`<button id="b-rr">↺ Reroll (${b.rerollsLeft})</button>`);
    parts.push(`<button class="primary" id="b-apply">Take the Shot</button>`);
  } else if (b.canPress) {
    parts.push(`<button class="ghost" id="b-hold">Hold</button>`);
    parts.push(`<button class="primary" id="b-press">⚔ Press the Attack (−${b.pressPenalty + 2})</button>`);
  } else if (b.shotThisTurn) {
    // The exchange is done. The engagement stays open; the turn does not.
    parts.push(`<button class="ghost" id="b-retreat">Retreat (−${Math.min(2, p.fuel)} fuel)</button>`);
    parts.push(`<button class="primary" id="b-endturn">End Turn ▸</button>`);
  } else {
    if (b.torpedoLeft) parts.push(`<button id="b-torp">◆ Fire Torpedo (${effectsOf(p).torpedo} dmg)</button>`);
    parts.push(`<button class="ghost" id="b-retreat">Retreat (−${Math.min(2, p.fuel)} fuel)</button>`);
    parts.push(`<button class="primary" id="b-fire">Fire ${esc(wep.name)}</button>`);
  }
  foot.innerHTML = parts.join(' ');

  if ($('#b-fire')) $('#b-fire').onclick = () => shoot(wep);
  if ($('#b-rr')) $('#b-rr').onclick = () => {
    b.rerollsLeft--;
    battleLine('sys', 'Recalibrating — rerolling.');
    shoot(b.lastRoll.weapon);
  };
  if ($('#b-apply')) $('#b-apply').onclick = () => { resolveRound(); renderBattle(); renderAll(); };
  if ($('#b-press')) $('#b-press').onclick = () => { pressAttack(); shoot(wep); };
  if ($('#b-hold')) $('#b-hold').onclick = () => { endRound(); renderBattle(); renderAll(); };
  if ($('#b-torp')) $('#b-torp').onclick = () => { fireTorpedo(); renderBattle(); renderAll(); };
  if ($('#b-endturn')) $('#b-endturn').onclick = () => {
    $('#ov-battle').classList.add('hidden');
    endTurn(); UI.pendingContact = null; UI.selected = null; UI.mode = null;
    renderAll();
  };
  if ($('#b-retreat')) $('#b-retreat').onclick = () => {
    retreat();
    $('#ov-battle').classList.add('hidden');
    UI.pendingContact = null;
    renderAll();
  };
  armFooterOnce(foot);
}

/* One decision per footer render. Each render stamps a new generation; a
   button only fires if it belongs to the current generation and nothing in
   that generation has fired yet. This kills both fast double-clicks (End Turn
   sits exactly where Press the Attack was) and clicks replayed on detached
   buttons from an earlier render, which could fire phantom extra shots. */
function armFooterOnce(foot) {
  const gen = String((+foot.dataset.gen || 0) + 1);
  foot.dataset.gen = gen;
  foot.querySelectorAll('button').forEach(btn => {
    const fn = btn.onclick;
    if (!fn) return;
    btn.onclick = e => {
      if (foot.dataset.gen !== gen || foot.dataset.spent === gen) return;
      foot.dataset.spent = gen;
      fn(e);
    };
  });
}

function tideFxText(fx) {
  const bits = [];
  if (fx.roll)    bits.push(`${fx.roll > 0 ? '+' : ''}${fx.roll} to hit`);
  if (fx.dmgOut)  bits.push(`${fx.dmgOut > 0 ? '+' : ''}${fx.dmgOut} damage dealt`);
  if (fx.dmgIn)   bits.push(`${fx.dmgIn > 0 ? '+' : ''}${fx.dmgIn} damage taken`);
  if (fx.selfHit) bits.push(`recoil ${fx.selfHit} on a hit`);
  if (fx.fuel)    bits.push(`${fx.fuel} fuel`);
  if (fx.noRegen) bits.push('no regeneration');
  return esc(bits.join(' · '));
}

/* ============================================================

   ============================================================ */
/* Highlights of a conquest — what changed, not a play-by-play. Doubles as the
   record of what a CPU just did while you were watching the board. */
function showConquestRecap(r) {
  if (!r) return;
  const p = G.players[r.player];
  const a = r.alien;
  const rows = [];

  rows.push(`<div class="recaprow salvage"><span class="rlabel">Salvaged</span>
    <span class="rval"><b>${esc(r.reward.name)}</b> — ${esc(r.reward.desc)}</span></div>`);

  if (r.conquestFuel) rows.push(`<div class="recaprow"><span class="rlabel">Prize crew</span><span class="rval">+${r.conquestFuel} fuel</span></div>`);
  if (r.healed) rows.push(`<div class="recaprow"><span class="rlabel">Repairs</span><span class="rval">+${r.healed} hearts</span></div>`);

  (r.missions || []).forEach(m => rows.push(`<div class="recaprow mission"><span class="rlabel">Mission</span>
    <span class="rval"><b>${esc(m.name)}</b> — ${esc(m.reward)}</span></div>`));

  if (r.card) rows.push(`<div class="recaprow event"><span class="rlabel">Event</span>
    <span class="rval">${r.card.glyph} <b>${esc(r.card.name)}</b> — ${esc(r.card.desc)}</span></div>`);

  (r.bumped || []).forEach(n => rows.push(`<div class="recaprow bump"><span class="rlabel">Beaten to it</span>
    <span class="rval">${esc(n)}'s engagement here ended</span></div>`));

  $('#recap-title').textContent = `Conquest — ${r.planet}`;
  $('#recap-body').innerHTML = `
    <div class="recaphead" style="border-color:${p.color}">
      <div class="rglyph">${a.glyph}</div>
      <div>
        <div class="rwho" style="color:${p.color}">${esc(p.name)}${isCpu(p) ? ` <span class="cputag">${esc(aiLevel(p).label)} CPU</span>` : ''}</div>
        <h3>${esc(a.name)} defeated</h3>
        <div class="rstats">
          <span>${r.exchanges} exchange${r.exchanges === 1 ? '' : 's'}</span>
          <span class="dealt">${r.dealt} dealt</span>
          <span class="taken">${r.taken} taken</span>
          ${r.fuelLost ? `<span class="taken">${r.fuelLost} fuel siphoned</span>` : ''}
        </div>
      </div>
    </div>
    <div class="recaplist">${rows.join('')}</div>
    <div class="recapfoot">
      <span style="color:var(--cyan)">◈ ${r.seals}/${r.gate} seals</span>
      <span style="color:var(--magenta)">${heartString(r.heartsAfter, r.maxHearts)}</span>
      <span style="color:var(--amber)">⛽ ${r.fuelAfter}</span>
    </div>`;
  $('#recap-note').textContent = r.seals >= r.gate ? 'The Haven Gate will open for you.' : '';
  $('#recap-ok').textContent = 'View Cards ▸';
  UI.pendingCards = [{ kind: 'species', alien: a, reward: r.reward, planet: r.planet }];
  if (r.card) UI.pendingCards.push({ kind: 'event', card: r.card });
  $('#ov-recap').classList.remove('hidden');
}

/* Humans go straight to the card reveals; the recap sheet stays for CPU
   conquests, where it is the record of what the machine did unattended. */
function queueConquestCards(r) {
  if (!r) return;
  UI.pendingCards = [{ kind: 'species', alien: r.alien, reward: r.reward, planet: r.planet }];
  if (r.card) UI.pendingCards.push({ kind: 'event', card: r.card });
  showNextPendingCard();
}

/* The recap is the summary; these are the actual cards behind it. */
function showNextPendingCard() {
  const next = (UI.pendingCards || []).shift();
  if (!next) { $('#ov-card').classList.add('hidden'); renderAll(); return; }
  if (next.kind === 'species') showSpeciesCardFace(next);
  else showEventCard(next.card);
}

$('#info-ok').onclick = () => $('#ov-info').classList.add('hidden');

function showWin() {
  const p = G.players[G.winner];
  $('#win-body').innerHTML = `
    <div class="winsplash">
      <div class="big">✷</div>
      <h1 style="color:${p.color}">${esc(p.name)}</h1>
      <p><b style="color:var(--ink)">Haven.</b> Blue-white under two moons, and nothing living on it that objects to you being there.
      ${esc(p.name)} took <b style="color:var(--cyan)">${p.conquered.length}</b> world${p.conquered.length === 1 ? '' : 's'} across
      <b style="color:var(--cyan)">${G.round}</b> round${G.round === 1 ? '' : 's'}${p.deaths ? `, losing ${p.deaths} ship${p.deaths > 1 ? 's' : ''} on the way` : ' without losing a ship'}.</p>
      <div class="chiprow" style="justify-content:center;margin-top:18px">
        ${p.alienAbilities.map(r => `<span class="chip alien">${esc(r.name)}</span>`).join('')}
      </div>
    </div>`;
  $('#ov-win').classList.remove('hidden');
}
$('#win-again').onclick = () => { $('#ov-win').classList.add('hidden'); openSetup(); };

/* ---------------- rules ---------------- */
function showRules() {
  $('#info-title').textContent = 'Rules of the Exodus';
  $('#info-body').innerHTML = `<div class="rules">
    <h3>The Object</h3>
    <p>Earth is done. <b>HAVEN</b> sits on the far side of the board — the last habitable world anyone has charted.
    Winning takes <b>both</b> of these, in order:</p>
    <ul>
      <li><b>Open the Gate</b> — conquer <b>${G.gate}</b> worlds (6 for one or two players, 5 for three or four).
      Until then Haven simply refuses you, by every route: warp, multi-hop travel, wormhole or beacon.</li>
      <li><b>Arrive at Haven</b> — actually fly there and land. Holding the seals is not winning; reaching the
      world is.</li>
    </ul>
    <p>So you cannot simply run for the line, and you cannot sit safely farming worlds either.</p>

    <h3>The Board</h3>
    <ul>
      <li><b>17 planets</b>, scattered at random, each held by a different alien species drawn from a 25-card pack.</li>
      <li>Each planet has <b>2–4 warp routes</b> to nearby planets. Every route costs <b>3–8 fuel</b> (average 5).
      The number on a route is always <b>what your ship pays</b>, with your own warp discounts already applied —
      so the numbers along a path always add up to the price you are quoted.</li>
      <li>Routes you can reach this turn are lit: <b>solid</b> for one hop away, <b>dashed</b> for everything
      further along that you could still afford. Selecting a destination draws its exact path in white.</li>
      <li>A planet, once conquered, <b>can never be conquered again</b> — by anyone. It stays open to fly through.</li>
      <li>Coloured dots above a world show the species' tier: <span style="color:#4ade80">●</span> light,
      <span style="color:#ffc247">●</span> serious, <span style="color:#ff5c5c">●</span> nightmare. Click any world to read its species card.</li>
    </ul>

    <h3>Selecting and Confirming</h3>
    <p>Clicking a world <b>selects</b> it — it never spends your turn. The action bar then tells you what is
    there and what you could do about it. Click the same world <b>again</b>, or press the confirm button,
    to actually go. <b>✕ Clear</b> or <b>Escape</b> backs out. You can look at as many worlds as you like
    before committing to one.</p>

    <h3>Your Turn</h3>
    <p>Collect income (1 fuel, +1 per planet you hold up to ${DEPOT_CAP}, plus any bonuses), then take
    <b>one action</b>. Your tank holds <b>${TANK_CAP}</b> — income past that is vented, so sitting on a
    full tank is throwing fuel away:</p>
    <ul>
      <li><b>Travel</b> to any world you can afford, <b>however many warp routes away</b> — the costs of every
      route on the cheapest path are added up and paid in one go. Leapfrog past worlds you do not want.
      Selecting a destination draws the exact route it would fly.</li>
      <li><b>Engage</b> the species holding the world you are sitting on.</li>
      <li><b>Scavenge</b> — +4 fuel, and on a d6 roll of 6, +3 more.</li>
      <li><b>Repair</b> — spend ${REPAIR_COST} fuel. Field repairs restore you to <b>two thirds of your maximum
      hearts</b>, or <b>+2</b>, whichever leaves you better off. One turn in the shop puts a wreck back in the
      fight; a ship that is only scratched gets topped off instead.</li>
    </ul>
    <p>Wormholes and beacon recalls from event cards count as your warp for the turn, but cost nothing.
    A banked extra turn can be spent whenever you like.</p>

    <h3>Battle</h3>
    <p><b>One exchange per turn.</b> A battle is not resolved in a single sitting. You fire once, and then the
    turn passes — to the next ship, whether they are on the map or locked in a fight of their own. Your
    engagement waits for you and resumes on your next turn. Several ships can be mid-battle at once, and
    because fights run to different lengths, the fleet advances at genuinely different rates.</p>
    <p>Two consequences worth knowing. If a rival conquers the world you are fighting over, <b>your
    engagement ends</b> — but you salvage an event card from the wreck you helped make. And a ship that
    falls behind on seals flies the leader's wake: <b>Slipstream</b> gives it extra fuel each turn and a
    bonus to its battle rolls, so a run of long fights does not put it out of the game.</p>
    <p>Each exchange you pick a weapon and roll <b>2d6</b>, add your modifiers, and read the chart:</p>
    ${chartTable(null)}
    <p style="margin-top:8px">Weapon type matters: a species <b>weak</b> to your damage type gives <b>+2</b>;
    one that <b>resists</b> it gives <b>−2</b>. Every species also has a <b>Strength</b> that works against you
    and a <b>Weakness</b> you can exploit. Beat a species and you take its technology permanently, plus an event card draw.</p>

    <p><b>Battle Tide.</b> A tactical condition is drawn at the start of every round and applies to that round
    only — a clean firing line, a sensor ghost, a debris field, a magnetar pulse that stops anything healing.
    Some help you, some help them. Time your risks around them.</p>

    <p><b>Pressure.</b> Every shot that fails to draw blood gives <b>+1</b> to your next shot, stacking, and
    clearing the moment you land a hit. A fight can be long, but it can never go nowhere.</p>

    <p><b>Press the Attack.</b> Land a Solid Hit or better and the target is reeling: fire again immediately,
    before it gets its end-of-round actions, at <b>−2</b>. <b>Once per turn</b> — with one exchange a turn,
    an unlimited chain would let a single lucky roll collapse a five-turn battle into one.</p>

    <p>You may <b>retreat</b> at any point for 2 fuel (or whatever you have left, if less) — you fall back the
    way you came, and the species will have fully repaired itself before your next attempt.</p>

    <h3>CPU Players</h3>
    <p>Any seat can be handed to the computer on the setup screen — mix humans and CPUs freely, or set
    every seat to CPU and watch. A CPU crew fits out its own ship (always with at least one real weapon)
    and takes its snake-eyes pick itself, so you are never asked to choose for it.</p>
    <ul>
      <li><b>Cadet</b> — green crew. Grabs whatever gun is loaded, never presses an advantage,
      breaks off early, and will not run the long lanes.</li>
      <li><b>Captain</b> — picks the weapon that beats the species in front of it, presses a reeling
      target, and long-warps out of a picked-clean corner. Beats a Cadet about <b>63%</b> of the time.</li>
    </ul>
    <p>CPU turns play out a step at a time so you can follow them, battles included, and they <b>stop on
    their results</b> — the exchange card at the end of a CPU's combat turn, and the conquest recap and
    cards after a CPU conquest — until you press <b>Continue</b>. Nothing is skipped past you.
    <b>Instant</b> speed is the exception: it means "don't show me anything" and clicks through by itself.
    Use <b>⏸ Pause</b> to stop the table, and <b>⏩</b> to cycle Slow / Normal / Fast / Instant. You can
    pan, zoom and read worlds while a CPU is thinking — you just cannot act for it.</p>

    <h3>Reading the Board</h3>
    <p>Scroll or pinch to <b>zoom</b>, drag to <b>pan</b>, double-click to zoom in on a spot. The buttons at the
    bottom right do the same, plus <b>◎</b> to centre on the active ship and <b>⤢</b> to fit the whole board.
    Keyboard: <b>+</b> / <b>−</b> to zoom, <b>C</b> to follow your ship, <b>0</b> to fit.</p>

    <h3>Damage and Death</h3>
    <p>Ships start with <b>5 hearts</b>; armour and alien technology raise that. At 0 hearts your ship is destroyed:
    you respawn at <b>Earth</b> at full hearts, <b>keep every system you have earned</b>, and lose half your fuel.
    Nobody is ever eliminated.</p>

    <h3>Setup Recap</h3>
    <ul>
      <li>Roll <b>2d6</b> for starting fuel, plus a <b>+${LAUNCH_ALLOWANCE}</b> launch allowance so nobody is
      stranded in orbit on turn one. Roll <b>snake eyes</b> and you choose a <b>4th</b> system — two fuel
      points is not a launch, it is an insult.</li>
      <li>Choose <b>3</b> of the 7 starship systems. Everyone also carries Point Defense Guns as standard.</li>
      <li>All ships launch from Earth.</li>
      <li><b>Supply priority:</b> each berth behind the first gets +2 starting fuel per place and draws one
      extra event card per place, to offset the tempo advantage of going first.</li>
    </ul>

    <h3>Design Notes</h3>
    <ul>
      <li>The Haven Gate seal requirement is an addition to the brief — without it the game is a pure fuel race
      and the aliens are scenery. It scales down with player count so the 17 worlds always go round.</li>
      <li>Species are dealt at random, then nudged so the tougher ones tend to sit further from Earth.
      The nudge is loose: you will still meet something horrible early.</li>
      <li>The final world, <b>Haven</b>, is an 18th node with no defender — the fight is getting there.</li>
    </ul>
  </div>`;
  $('#ov-info').classList.remove('hidden');
}

/* ============================================================
   WIRING
   ============================================================ */
$('#btn-rules').onclick = showRules;
$('#btn-newgame').onclick = () => { if (confirm('Abandon this game and start a new one?')) openSetup(); };
$$('.tabs button').forEach(b => b.onclick = () => {
  $$('.tabs button').forEach(x => x.classList.remove('active'));
  $$('.tabpane').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  $('#pane-' + b.dataset.tab).classList.add('active');
  UI.activeTab = b.dataset.tab;
});

$('#turn-go').onclick = () => $('#ov-turn').classList.add('hidden');

/* ============================================================
   FAULT TRAP & WATCHDOG — a fault must never silently freeze the table
   ============================================================ */
let faultHideTimer = null;
function showFault(msg) {
  const el = $('#fault');
  if (!el) return;
  $('#fault-msg').textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(faultHideTimer);
  faultHideTimer = setTimeout(() => el.classList.add('hidden'), 15000);
  // Pull the UI back to a coherent state on the next tick; if the fault is in
  // rendering itself this quietly gives up and leaves the toast for the report.
  setTimeout(() => { try { renderAll(); } catch (_) {} }, 0);
}
window.addEventListener('error', e =>
  showFault(`${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})`));
window.addEventListener('unhandledrejection', e =>
  showFault(String((e.reason && e.reason.message) || e.reason || 'async fault')));
$('#fault-close').onclick = () => $('#fault').classList.add('hidden');

/* If a CPU turn ever loses its step timer, this quietly restarts it.
   aiTick is idempotent and self-gating, so a spurious call does nothing. */
setInterval(() => { if (G.started && !gameOver()) aiTick(); }, 2500);

initViewControls();
openSetup();

</script>
